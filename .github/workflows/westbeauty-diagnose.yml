name: Diagnose West Beauty V2 on Windows
on:
  push:
    branches: [fix/westbeauty-windows-20261002]
    paths: [.github/workflows/westbeauty-diagnose.yml, westbeauty/test_windows.ps1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: WestBeautyRemote-V2-Setup-x64
          run-id: 36115432841
          github-token: ${{ github.token }}
          path: original
      - name: Install, launch and remove original V2 in disposable Windows runner
        shell: pwsh
        run: ./westbeauty/test_windows.ps1 -Installer './original/西美远控-Setup-x64.exe' -Baseline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: WestBeauty-V2-Baseline-Windows-QA
          path: qa-results
          retention-days: 14
