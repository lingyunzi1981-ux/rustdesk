name: Build West Beauty Remote

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/westbeauty-build.yml'
      - 'westbeauty/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/westbeauty-build.yml'
      - 'westbeauty/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RustDesk 1.4.9
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: "1.4.9"
          submodules: recursive
          path: src

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          components: rustfmt

      - name: Install Flutter 3.22.3 for bridge generation
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Generate Flutter/Rust bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' src/flutter/pubspec.yaml
          pushd src/flutter
          flutter pub get
          popd
          ~/.cargo/bin/flutter_rust_bridge_codegen             --rust-input ./src/src/flutter_ffi.rs             --dart-output ./src/flutter/lib/generated_bridge.dart             --c-output ./src/flutter/macos/Runner/bridge_generated.h
          cp ./src/flutter/macos/Runner/bridge_generated.h ./src/flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-artifact
          path: |
            ./src/src/bridge_generated.rs
            ./src/src/bridge_generated.io.rs
            ./src/flutter/lib/generated_bridge.dart
            ./src/flutter/lib/generated_bridge.freezed.dart
            ./src/flutter/macos/Runner/bridge_generated.h
            ./src/flutter/ios/Runner/bridge_generated.h

  build-topmost:
    runs-on: windows-2022
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build RustDeskTempTopMostWindow x64
        shell: pwsh
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow.git topmost
          Set-Location topmost
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Upload topmost artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topmostwindow-artifacts-x64
          path: ./topmost/WindowInjection/x64/Release/WindowInjection.dll

  build-windows-x64:
    needs: [generate-bridge, build-topmost]
    runs-on: windows-2022
    steps:
      - name: Checkout West Beauty build scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: westbeauty-build
          path: builder

      - name: Checkout RustDesk 1.4.9
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: "1.4.9"
          submodules: recursive
          path: src

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: src

      - name: Install LLVM and Clang 15.0.6
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"

      - name: Install Flutter 3.24.5
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: "3.24.5"
          architecture: x64

      - name: Replace with RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Write-Host "Flutter root: $flutterRoot"
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release -Force
          $engineDir = Join-Path $flutterRoot 'bin\cache\artifacts\engine\windows-x64-release'
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Copy-Item .\windows-x64-release\* $engineDir -Recurse -Force

      - name: Patch Flutter 3.24.5
        shell: pwsh
        run: |
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Copy-Item .\src\.github\patches\flutter_3.24.4_dropdown_menu_enableFilter.diff $flutterRoot -Force
          Push-Location $flutterRoot
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          Pop-Location

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: westbeauty-windows-2022
          workspaces: src

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        working-directory: src
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Generate West Beauty branding assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python .\builder\westbeauty\generate_branding.py .\builder

      - name: Apply West Beauty customization
        shell: pwsh
        run: |
          python .\builder\westbeauty\patch_rustdesk.py .\src --bundle .\builder
          Get-Content .\src\WEST_BEAUTY_PATCH_LOG.txt
          Get-Content .\src\WEST_BEAUTY_CUSTOMIZATION.json

      - name: Build RustDesk x64
        shell: pwsh
        working-directory: src
        run: |
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item .\flutter\build\windows\x64\runner\Release .\rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path .\usbmmidd_v2\Win32 -Recurse -Force
          Remove-Item -Path .\usbmmidd_v2\deviceinstaller64.exe, .\usbmmidd_v2\deviceinstaller.exe, .\usbmmidd_v2\usbmmidd.bat -Force
          Move-Item -Force .\usbmmidd_v2 .\rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksumDriver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadDriver = (Get-FileHash rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256).Hash
            $checksumAdapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadAdapter = (Get-FileHash printer_driver_adapter.zip -Algorithm SHA256).Hash
            if ($checksumDriver -eq $downloadDriver -and $checksumAdapter -eq $downloadAdapter) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath . -Force
              New-Item -ItemType Directory -Force .\rustdesk\drivers | Out-Null
              Move-Item -Force .\rustdesk_printer_driver_v4-1.4 .\rustdesk\drivers\RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath . -Force
              Move-Item -Force .\printer_driver_adapter.dll .\rustdesk
            }
          } catch {
            Write-Warning "Printer driver optional step failed: $($_.Exception.Message)"
          }

      - name: Copy Runner resource
        shell: pwsh
        working-directory: src
        run: |
          $runnerRes = Get-ChildItem -Recurse -Filter Runner.res | Select-Object -First 1
          if ($runnerRes) {
            Copy-Item $runnerRes.FullName .\libs\portable\Runner.res -Force
          }

      - name: Restore topmost helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: src/rustdesk

      - name: Build complete self-extracted EXE
        shell: pwsh
        working-directory: src
        run: |
          $manifest = Get-Content .\res\manifest.xml
          $manifest | Where-Object { $_ -notmatch 'dpiAware' } | Set-Content .\res\manifest.xml -Encoding UTF8
          Push-Location .\libs\portable
          python -m pip install --disable-pip-version-check -r requirements.txt
          python .\generate.py -f ..\..\rustdesk\ -o . -e ..\..\rustdesk\rustdesk.exe
          Pop-Location
          New-Item -ItemType Directory -Force .\SignOutput | Out-Null
          Move-Item .\target\release\rustdesk-portable-packer.exe '.\SignOutput\西美远控.exe' -Force
          Get-FileHash '.\SignOutput\西美远控.exe' -Algorithm SHA256 | Format-List
          (Get-Item '.\SignOutput\西美远控.exe').VersionInfo | Format-List FileDescription,ProductName,CompanyName,FileVersion,ProductVersion

      - name: Upload final West Beauty Remote EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: WestBeautyRemote-Windows-x64
          path: src/SignOutput/西美远控.exe
          if-no-files-found: error
